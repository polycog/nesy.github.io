<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>More coming soon</title>
  <meta name="description" content="More coming soon.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ecebf3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16151f" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%235b4bdb'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ecebf3;
      --ink: #1f1d36;
      --muted: #6b6880;
      --accent: #5b4bdb;
      --font: "Bricolage Grotesque", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16151f;
        --ink: #ecebf3;
        --muted: #a19eb8;
        --accent: #8f83ff;
      }
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body { height: 100%; margin: 0; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding:
        max(1.5rem, env(safe-area-inset-top))
        max(1.5rem, env(safe-area-inset-right))
        max(1.5rem, env(safe-area-inset-bottom))
        max(1.5rem, env(safe-area-inset-left));
    }

    main {
      width: 100%;
      max-width: 40rem;
      text-align: left;
    }

    .dot {
      display: block;
      width: 0.9rem;
      height: 0.9rem;
      border-radius: 50%;
      background: var(--accent);
      margin-bottom: 2rem;
      animation: pulse 2.4s ease-in-out infinite;
    }

    h1 {
      font-weight: 700;
      font-size: clamp(2.75rem, 11vw, 5.5rem);
      line-height: 0.95;
      letter-spacing: -0.035em;
      margin: 0 0 1.25rem;
    }

    p {
      font-size: clamp(1.05rem, 2.6vw, 1.25rem);
      line-height: 1.5;
      color: var(--muted);
      margin: 0;
      max-width: 32ch;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.7); opacity: 0.55; }
    }

    @media (prefers-reduced-motion: reduce) {
      .dot { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <span class="dot" aria-hidden="true"></span>
    <h1>More coming soon.</h1>
    <p>We're working on something new. Check back shortly.</p>
  </main>
</body>
</html>
